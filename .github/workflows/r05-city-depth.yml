name: R05 City Depth service access (#51)
on:
  push:
    branches: [feat/r05-city-depth-51]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/r05-city-depth-initiative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Focused city topology and native service road
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p work/r05-city-depth
          /tmp/godot --headless --path . --editor --import --quit > work/r05-city-depth/import.log 2>&1
          timeout 45s /tmp/godot --headless --path . --script res://tests/test_city_east_service.gd 2>&1 | tee work/r05-city-depth/geometry.log
          grep -q CITY_EAST_SERVICE_PASS work/r05-city-depth/geometry.log
          timeout 90s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_city_east_service_scene.gd 2>&1 | tee work/r05-city-depth/native.log
          grep -q CITY_EAST_SERVICE_SCENE_PASS work/r05-city-depth/native.log
      - name: Complete Godot domain and native regressions
        env:
          GODOT_BIN: /tmp/godot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OD2D_LOGS=work/r05-city-depth/domain python3 tests/run_city_gate.py | tee work/r05-city-depth/domain-summary.log
          OD2D_LOGS=work/r05-city-depth/native xvfb-run -a -s '-screen 0 1280x1400x24' python3 tests/run_city_gate.py --native | tee work/r05-city-depth/native-summary.log
      - name: Install pinned Web export templates and Chromium
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp /tmp/godot-templates/templates/web* ~/.local/share/godot/export_templates/4.7.2.stable/
          npm install --prefix /tmp/od2d-node playwright@1.56.0
          /tmp/od2d-node/node_modules/.bin/playwright install --with-deps chromium
          echo 'NODE_PATH=/tmp/od2d-node/node_modules' >> "$GITHUB_ENV"
      - name: Exact-head integrated Chromium current-world suites
        env:
          GODOT_BIN: /tmp/godot
          OD2D_LOGS: work/r05-city-depth/chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 tests/run_exported_gate.py --scope current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-city-depth-evidence
          path: work/r05-city-depth/
          retention-days: 3
