name: R05 matched long-route diagnosis (manual one-shot branch)
on:
  push:
    branches: [feat/r05-living-route-audit]
    paths: ['qa/long_route_probe.cjs', '.github/workflows/r05-living-route-audit.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact same Godot and Chromium once
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp /tmp/godot-templates/templates/web* ~/.local/share/godot/export_templates/4.7.2.stable/
          npm install --prefix /tmp/od2d-node playwright@1.56.0
          /tmp/od2d-node/node_modules/.bin/playwright install --with-deps chromium
      - name: Matched-run authentic long fare on baseline and Living Streets
        env:
          NODE_PATH: /tmp/od2d-node/node_modules
          OD2D_WEB_URL: http://127.0.0.1:8765/index.html
        run: |
          set -euo pipefail
          mkdir -p /tmp/od2d-long-audit
          cp qa/long_route_probe.cjs /tmp/od2d-long-audit/long_route_probe.cjs
          for entry in 'baseline f7b014c288250159da7e7dd793d6ea11dd79c204' 'living 3c59a0809749b50cea92db40bb9d76fb87039363'; do
            set -- $entry
            label="$1"; sha="$2"
            git checkout --detach --force "$sha"
            rm -rf .godot
            mkdir -p "/tmp/od2d-long-audit/$label"
            /tmp/godot --headless --path . --editor --import --quit > "/tmp/od2d-long-audit/$label/import.log" 2>&1
            /tmp/godot --headless --path . --export-release Web "/tmp/od2d-long-audit/$label/index.html" > "/tmp/od2d-long-audit/$label/export.log" 2>&1
            sha256sum "/tmp/od2d-long-audit/$label/index.pck" | tee "/tmp/od2d-long-audit/$label/export-sha256.txt"
            python3 -m http.server 8765 --bind 127.0.0.1 --directory "/tmp/od2d-long-audit/$label" > "/tmp/od2d-long-audit/$label/server.log" 2>&1 &
            server_pid="$!"
            sleep 2
            set +e
            OD2D_BROWSER_MODULE="$PWD/tests/city_browser.cjs" \
            OD2D_SHA="$sha" OD2D_PROBE_LABEL="$label" \
            OD2D_PROBE_JSON="/tmp/od2d-long-audit/$label/probe.json" \
              timeout 990s node /tmp/od2d-long-audit/long_route_probe.cjs \
              > "/tmp/od2d-long-audit/$label/probe.log" 2>&1
            status="$?"
            set -e
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo "$status" > "/tmp/od2d-long-audit/$label/exit.txt"
            cat "/tmp/od2d-long-audit/$label/probe.log"
          done
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/od2d-long-audit')
          rows={}
          for name in ('baseline','living'):
              file=root/name/'probe.json'
              rows[name]=json.loads(file.read_text()) if file.exists() else {'pass':False,'error':'missing probe output'}
          summary={k:{'pass':v.get('pass'),'wall_seconds':v.get('travelWallSeconds'),
              'error':v.get('error'),'last':v.get('lastData'),'sample_count':len(v.get('samples',[]))}
              for k,v in rows.items()}
          if rows['baseline'].get('travelWallSeconds') and rows['living'].get('travelWallSeconds'):
              summary['living_over_baseline_ratio']=round(rows['living']['travelWallSeconds']/rows['baseline']['travelWallSeconds'],3)
          (root/'comparison.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('MATCHED_DIAGNOSIS',json.dumps(summary),flush=True)
          assert all(v.get('pass') for v in rows.values()),'One matched run did not complete the real fare'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-matched-long-route
          path: /tmp/od2d-long-audit
          retention-days: 3
