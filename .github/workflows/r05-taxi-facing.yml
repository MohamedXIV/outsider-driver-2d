name: R05 taxi-facing regression
on:
  push:
    branches: [feat/r05-taxi-facing]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/r05-taxi-facing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Domain and adapter tests
        env:
          GODOT_BIN: /tmp/godot
          OD2D_LOGS: work/r05/domain
        run: python3 tests/run_city_gate.py
      - name: Native rendered tests including R05 taxi heading
        env:
          GODOT_BIN: /tmp/godot
          OD2D_LOGS: work/r05/native
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1400x24' python3 tests/run_city_gate.py --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-taxi-facing-logs
          path: work/r05/
          retention-days: 7
