name: Integrated city playtest builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q /tmp/templates.tpz templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          npm --prefix /tmp/city-tools install --no-save --no-audit --no-fund inkjs@2.4.0 playwright@1.56.0
          /tmp/city-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Verify compiled Ink matches source
        shell: bash
        run: |
          set -euo pipefail
          for story in stories/*.ink; do
            /tmp/city-tools/node_modules/.bin/inkjs-compiler -o /tmp/compiled.json "$story"
            python3 - "$story.json" <<'PY'
          import pathlib, sys
          expected = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig').strip()
          actual = pathlib.Path('/tmp/compiled.json').read_text(encoding='utf-8-sig').strip()
          assert expected == actual, sys.argv[1]
          PY
          done
      - name: Domain and adapter gate
        env:
          GODOT_BIN: /tmp/godot
        run: python3 tests/run_city_gate.py
      - name: Native Linux rendered gameplay gate
        env:
          GODOT_BIN: /tmp/godot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tests/run_city_gate.py --native
      - name: Export Linux, Windows and Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux build/windows build/web
          /tmp/godot --headless --path . --export-release Linux build/linux/outsider-driver.x86_64 > /tmp/linux-export.log 2>&1
          /tmp/godot --headless --path . --export-release 'Windows Desktop' build/windows/outsider-driver.exe > /tmp/windows-export.log 2>&1
          /tmp/godot --headless --path . --export-release Web build/web/index.html > /tmp/web-export.log 2>&1
          chmod +x build/linux/outsider-driver.x86_64
          build/linux/outsider-driver.x86_64 --headless --quit-after 90 > /tmp/linux-boot.log 2>&1
          if rg 'SCRIPT ERROR|ERROR:|Parse Error' /tmp/*-export.log /tmp/linux-boot.log; then exit 1; fi
          cp docs/CITY_PLAYTEST.md build/PLAYTEST.md
          git rev-parse HEAD > build/SOURCE_COMMIT.txt
      - name: Exercise exported Web with real Chromium pointer input
        env:
          NODE_PATH: /tmp/city-tools/node_modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory build/web > /tmp/city-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/web_city_playability.cjs | tee /tmp/web-city.log
          node tests/web_city_routes.cjs | tee /tmp/web-city-routes.log
      - uses: actions/upload-artifact@v4
        with:
          name: outsider-driver-integrated-builds
          path: build/
          retention-days: 21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-playability-evidence
          path: |
            /tmp/od2d-city-evidence/
            /tmp/od2d-gate-logs/
            /tmp/*-export.log
            /tmp/linux-boot.log
            /tmp/web-city.log
            /tmp/web-city-routes.log
          retention-days: 21
