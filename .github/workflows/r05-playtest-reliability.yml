name: R05 playtest reliability diagnosis
on:
  push:
    branches: [feat/r05-playtest-reliability-86]
    paths:
      - 'tests/test_playtest_liveness_scene.gd'
      - 'scripts/sandbox/sandbox_player_ui.gd'
      - 'scripts/sandbox/sandbox_main.gd'
      - 'scripts/sandbox/sandbox_street_pilot.gd'
      - 'tests/test_failed_handoff_scene.gd'
      - 'tests/test_live_shared_traffic_scene.gd'
      - 'tests/test_event_history_cache_scene.gd'
      - 'tests/test_reposition_history_index.gd'
      - 'scripts/sandbox/sandbox_world.gd'
      - 'scripts/sandbox/sandbox_vehicle_execution.gd'
      - 'scripts/sandbox/sandbox_world_vehicle_body.gd'
      - 'scripts/sandbox/sandbox_world_vehicle_corridor.gd'
      - 'tests/test_playtest_roundtrip_scene.gd'
      - '.github/workflows/r05-playtest-reliability.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Import source and run human-reported Clinic liveness probe
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/playtest-triage
          /tmp/godot --headless --path . --editor --import --quit > work/playtest-triage/import.log 2>&1
          /tmp/godot --headless --path . --check-only --script res://scripts/sandbox/sandbox_player_ui.gd 2>&1 | tee work/playtest-triage/parse.log
          timeout 240s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_playtest_liveness_scene.gd 2>&1 | tee work/playtest-triage/liveness.log
          grep -q PLAYTEST_LIVENESS_PASS work/playtest-triage/liveness.log
          timeout 240s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_playtest_roundtrip_scene.gd 2>&1 | tee work/playtest-triage/roundtrip.log
          grep -q PLAYTEST_ROUNDTRIP_PASS work/playtest-triage/roundtrip.log
          timeout 90s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_failed_handoff_scene.gd 2>&1 | tee work/playtest-triage/handoff.log
          grep -q FAILED_HANDOFF_SAFETY_PASS work/playtest-triage/handoff.log
          timeout 180s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_live_shared_traffic_scene.gd 2>&1 | tee work/playtest-triage/shared-street.log
          grep -q PLAYTEST_SHARED_STREET_PASS work/playtest-triage/shared-street.log
          timeout 180s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_event_history_cache_scene.gd 2>&1 | tee work/playtest-triage/event-history.log
          grep -q EVENT_HISTORY_CACHE_PASS work/playtest-triage/event-history.log
          timeout 100s /tmp/godot --headless --path . --script res://tests/test_reposition_history_index.gd 2>&1 | tee work/playtest-triage/reposition-history.log
          grep -q REPOSITION_HISTORY_INDEX_PASS work/playtest-triage/reposition-history.log
      - name: Existing Native crossing and Player Map regression
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_player_guidance_scene.gd 2>&1 | tee work/playtest-triage/ui.log
          grep -q PLAYER_GUIDANCE_SCENE_PASS work/playtest-triage/ui.log
          timeout 90s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_two_resident_crossing_scene.gd 2>&1 | tee work/playtest-triage/crossings.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-playtest-triage-evidence
          path: work/playtest-triage
          retention-days: 4
