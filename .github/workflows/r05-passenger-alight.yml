name: R05 passenger alight native verification
on:
  push:
    branches: [feat/r05-passenger-alight]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/r05-passenger-alight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Godot 4.7.2 and headless display
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Native source import and focused domain + scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p work/r05-alight
          /tmp/godot --headless --path . --editor --import --quit 2>&1 | tee work/r05-alight/import.log
          timeout 30s /tmp/godot --headless --path . --script res://tests/test_passenger_alight.gd 2>&1 | tee work/r05-alight/domain.log
          grep -q PASSENGER_ALIGHT_PASS work/r05-alight/domain.log
          timeout 60s xvfb-run -a -s '-screen 0 1280x1400x24' /tmp/godot --path . --audio-driver Dummy --script res://tests/test_passenger_alight_scene.gd 2>&1 | tee work/r05-alight/scene.log
          grep -q PASSENGER_ALIGHT_SCENE_PASS work/r05-alight/scene.log
      - name: Full Godot 4.7.2 domain and native regression gates
        env:
          GODOT_BIN: /tmp/godot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OD2D_LOGS=work/r05-alight/full-domain python3 tests/run_city_gate.py | tee work/r05-alight/full-domain-summary.log
          OD2D_LOGS=work/r05-alight/full-native xvfb-run -a -s '-screen 0 1280x1400x24' python3 tests/run_city_gate.py --native | tee work/r05-alight/full-native-summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-alight-evidence
          path: |
            work/r05-alight/
            /tmp/od2d-alight-evidence/*.png
          retention-days: 7
