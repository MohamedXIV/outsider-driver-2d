name: R05 directed lane geometry
on:
  push:
    branches: [feat/r05-directed-lanes]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/r05-directed-lanes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
      - name: Focused directed lane geometry
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p work/r05-directed
          /tmp/godot --headless --path . --editor --import --quit > work/r05-directed/import.log 2>&1
          timeout 45s /tmp/godot --headless --path . --script res://tests/test_directed_lanes.gd 2>&1 | tee work/r05-directed/focused.log
          grep -q DIRECTED_LANES_PASS work/r05-directed/focused.log
      - name: Complete Godot domain and native regressions
        env:
          GODOT_BIN: /tmp/godot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OD2D_LOGS=work/r05-directed/domain python3 tests/run_city_gate.py | tee work/r05-directed/domain-summary.log
          OD2D_LOGS=work/r05-directed/native xvfb-run -a -s '-screen 0 1280x1400x24' python3 tests/run_city_gate.py --native | tee work/r05-directed/native-summary.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r05-directed-evidence
          path: work/r05-directed/
          retention-days: 7
