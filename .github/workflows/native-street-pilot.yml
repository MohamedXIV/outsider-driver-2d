name: Native street navigation pilot (temporary single-branch gate)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-pedestrian-crossing-pilot
    paths-ignore:
      - 'docs/**'
permissions:
  contents: read
jobs:
  native-street:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor and Linux display
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
          /tmp/godot --version
      - name: Import and parse the full project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot --headless --path . --editor --import --quit > /tmp/import.log 2>&1 || { cat /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Native Godot pedestrian navigation and traffic proof
        shell: bash
        run: |
          set -euo pipefail
          for spec in test_street_module test_street_priority test_street_pilot_scene test_street_junction_scene test_npc_interpolation_scene test_street_main_scene test_street_handoff test_taxi_crossing_world test_taxi_crossing_scene test_taxi_crossing_return_scene test_taxi_crossing_unload_scene test_city_presentation; do
            LIBGL_ALWAYS_SOFTWARE=1 timeout 95s xvfb-run -a -s "-screen 0 1280x720x24" \
              /tmp/godot --audio-driver Dummy --path . --script "res://tests/${spec}.gd" > "/tmp/${spec}.log" 2>&1 || { cat "/tmp/${spec}.log"; exit 1; }
            cat "/tmp/${spec}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' "/tmp/${spec}.log"; then exit 1; fi
            if ! grep -E 'STREET_MODULE_PASS|STREET_PRIORITY_PASS|STREET_PILOT_PASS|STREET_JUNCTION_PASS|NPC_INTERPOLATION_PASS|STREET_MAIN_PASS|STREET_HANDOFF_PASS|TAXI_CROSSING_WORLD_PASS|TAXI_CROSSING_SCENE_PASS|TAXI_CROSSING_RETURN_SCENE_PASS|TAXI_CROSSING_UNLOAD_SCENE_PASS|CITY_PRESENTATION_PASS' "/tmp/${spec}.log"; then exit 1; fi
          done
      - name: Upload targeted native proof logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-navigation-test-logs
          path: |
            /tmp/import.log
            /tmp/test_street_module.log
            /tmp/test_street_priority.log
            /tmp/test_street_pilot_scene.log
            /tmp/test_street_junction_scene.log
            /tmp/test_npc_interpolation_scene.log
            /tmp/test_street_main_scene.log
            /tmp/test_street_handoff.log
            /tmp/test_taxi_crossing_world.log
            /tmp/test_taxi_crossing_scene.log
            /tmp/test_taxi_crossing_return_scene.log
            /tmp/test_taxi_crossing_unload_scene.log
            /tmp/test_city_presentation.log
            /tmp/od2d-street-evidence/*.png
          if-no-files-found: ignore
