name: Full stacked integration validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        scope: [native, current, debug, fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_BIN: /tmp/godot
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      OD2D_LOGS: work/validation/${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Godot 4.7.2 editor, Web templates and Chromium
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          mkdir -p work/validation
          touch work/.gdignore
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp /tmp/godot-templates/templates/web* ~/.local/share/godot/export_templates/4.7.2.stable/
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libxcursor1 libxinerama1 libxi6 libxrandr2
          npm install --prefix /tmp/od2d-node playwright@1.56.0
          /tmp/od2d-node/node_modules/.bin/playwright install --with-deps chromium
          echo 'NODE_PATH=/tmp/od2d-node/node_modules' >> "$GITHUB_ENV"
          /tmp/godot --version
      - name: Complete domain and native gates
        if: matrix.scope == 'native'
        shell: bash
        run: |
          set -euo pipefail
          OD2D_LOGS=work/validation/native/domain python tests/run_city_gate.py | tee work/validation/domain-summary.log
          OD2D_LOGS=work/validation/native/scenes xvfb-run -a -s '-screen 0 1280x1400x24' python tests/run_city_gate.py --native | tee work/validation/native-summary.log
      - name: All exported Chromium contracts for this scope
        if: matrix.scope != 'native'
        run: python tests/run_exported_gate.py --scope ${{ matrix.scope }}
      - name: Publish exact head and evidence
        if: always()
        shell: bash
        run: |
          echo '### Integration validation — ${{ matrix.scope }}' >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Godot 4.7.2; logs, manifests and screenshots are attached to this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing checks establish technical evidence only; human playtest and Windows acceptance remain open.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-head-${{ matrix.scope }}
          path: |
            work/validation/**/*.log
            work/validation/**/head.txt
            work/validation/**/manifest.json
            work/validation/**/screenshots/**/*.png
            /tmp/od2d-street-evidence/*.png
            /tmp/od2d-city-evidence/*.png
            /tmp/od2d-city-evidence/*.json
            /tmp/od2d-ink-evidence/**/*.png
            /tmp/p0-evidence/*.png
          if-no-files-found: warn
